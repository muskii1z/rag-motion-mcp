[project]
name = "rag-motion-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Musab Saraswat", email = "musab.work17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "ragmotion",
]

[project.scripts]
rag-motion-mcp = "rag_motion_mcp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ragmotion = { path = "../rag-motion", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
