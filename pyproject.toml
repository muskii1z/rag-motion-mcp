[project]
name = "rag-motion-mcp"
version = "0.1.0"
description = "MCP server connecting AI assistants to rag-motion (cited exercise RAG + program agent) and the wger workout tracker"
readme = "README.md"
authors = [
    { name = "Musab Saraswat", email = "musab.work17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "ragmotion",
]

[project.scripts]
rag-motion-mcp = "rag_motion_mcp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ragmotion = { path = "../rag-motion", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
